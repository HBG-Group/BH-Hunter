name: DAST (OWASP ZAP Baseline)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Authorized HTTPS URL to scan (for example a staging deployment)
        required: true
        type: string
      rules_file:
        description: Optional ZAP rules file path in the repository
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Validate scan target
        id: validated-scan-target
        env:
          TARGET_URL: ${{ inputs.target_url }}
          DAST_ALLOWED_HOSTS: ${{ vars.DAST_ALLOWED_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          host="$(node scripts/validate-deployment-url.mjs "$TARGET_URL" "$DAST_ALLOWED_HOSTS")"
          echo "Scan target validated: $host"

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ steps.validated-scan-target.outputs.url }}
          rules_file_name: ${{ inputs.rules_file }}
          cmd_options: "-a"
          allow_issue_writing: false
          artifact_name: zap-baseline-report
