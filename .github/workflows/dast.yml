name: DAST (OWASP ZAP Baseline)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Authorized HTTPS URL to scan (for example a staging deployment)
        required: true
        type: string
      rules_file:
        description: Optional ZAP rules file path in the repository
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate scan target
        env:
          TARGET_URL: ${{ inputs.target_url }}
          DAST_ALLOWED_HOSTS: ${{ vars.DAST_ALLOWED_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_URL" =~ ^https://([^/:]+) ]]; then
            echo "::error::target_url must be an absolute https:// URL."
            exit 1
          fi
          host="${BASH_REMATCH[1]}"
          allowed="${DAST_ALLOWED_HOSTS:-*.vercel.app}"
          match="false"
          IFS=',' read -ra entries <<< "$allowed"
          for entry in "${entries[@]}"; do
            entry="$(printf '%s' "$entry" | tr -d '[:space:]')"
            if [[ -z "$entry" ]]; then
              continue
            fi
            if [[ "$entry" == *"*"* ]]; then
              if [[ "$host" == *"${entry#\*}" ]]; then
                match="true"
              fi
            elif [[ "$host" == "$entry" ]]; then
              match="true"
            fi
          done
          if [[ "$match" != "true" ]]; then
            echo "::error::Refusing to scan '$host'. Add its host to the DAST_ALLOWED_HOSTS repository variable."
            exit 1
          fi
          echo "Scan target validated: $host"

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ inputs.target_url }}
          rules_file_name: ${{ inputs.rules_file }}
          cmd_options: "-a"
          allow_issue_writing: false
          artifact_name: zap-baseline-report
