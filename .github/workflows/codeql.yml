name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - feature/improved-security
  schedule:
    - cron: "0 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@adfda868f108ac4222129de456ea554034a27db7 # v4

      - name: Analyze
        uses: github/codeql-action/analyze@adfda868f108ac4222129de456ea554034a27db7 # v4
